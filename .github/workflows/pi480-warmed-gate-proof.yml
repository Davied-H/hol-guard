name: Pi-480 warmed gate proof
on:
  push:
    branches: [ci/pi480-warmed-gate-proof]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: d50c973ce640ab2fbfbd19c7710f87301b30248c
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build the exact merged native evaluators
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          python3 scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare public command resources
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
      - name: Prove normal correctness and reject a slow response
        env:
          HOL_GUARD_NATIVE_REGRESSION: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
        run: |
          set -euo pipefail
          uv run --no-sync pytest tests/test_guard_daemon_acceptance.py -k packaged_correctness_workloads -q --tb=short
          cat > "$RUNNER_TEMP/warmed_slowdown_probe.py" <<'PY'
          import http.client
          import time
          import pytest
          @pytest.fixture(autouse=True)
          def slow_response(monkeypatch):
              original = http.client.HTTPResponse.read
              def delayed(self, *args, **kwargs):
                  body = original(self, *args, **kwargs)
                  time.sleep(1.0)
                  return body
              monkeypatch.setattr(http.client.HTTPResponse, "read", delayed)
          PY
          set +e
          PYTHONPATH="$RUNNER_TEMP:${PYTHONPATH:-}" uv run --no-sync pytest -p warmed_slowdown_probe 'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]' -q --tb=short > "$RUNNER_TEMP/warmed-slowdown.log" 2>&1
          result=$?
          set -e
          rm "$RUNNER_TEMP/warmed_slowdown_probe.py"
          cat "$RUNNER_TEMP/warmed-slowdown.log"
          test "$result" -eq 1
          grep -F 'test_guard_daemon_acceptance.py:75:' "$RUNNER_TEMP/warmed-slowdown.log"
          grep -F 'assert result.p95_ms < p95_limit_ms' "$RUNNER_TEMP/warmed-slowdown.log"
          echo 'The unchanged latency assertion rejected the injected slowdown after correctness assertions passed.'
