name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'PR-only planner'
  native-command-evaluators:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Successful native producer'
  coverage:
    needs: [plan, native-command-evaluators]
    if: "!cancelled() && needs.native-command-evaluators.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Successful complete coverage producer'
  old-condition:
    needs: [coverage, native-command-evaluators]
    if: needs.coverage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Old condition ran'
  fixed-condition:
    needs: [coverage, native-command-evaluators]
    if: >-
      !cancelled() &&
      needs.coverage.result == 'success' &&
      needs.native-command-evaluators.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Fixed condition ran after successful producers'
  verify:
    needs: [plan, coverage, old-condition, fixed-condition]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ needs.plan.result }}
      COVERAGE: ${{ needs.coverage.result }}
      OLD: ${{ needs.old-condition.result }}
      FIXED: ${{ needs.fixed-condition.result }}
    steps:
      - name: Verify skipped-ancestor control and corrected condition
        run: |
          test "$PLAN" = skipped
          test "$COVERAGE" = success
          test "$OLD" = skipped
          test "$FIXED" = success
          printf 'Verified skipped planner, successful coverage, skipped old condition, successful fixed condition.\n'
