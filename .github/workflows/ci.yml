name: CI updater coverage trial
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  shard:
    name: coverage shard 54 (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: control
            source: f90a1562ce176b3a461ce35b737b479af684f475
          - variant: candidate
            source: e3f6cf65e1ed0d2eada1dc615b06a90cc8c3722d
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12.14'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            requirements.txt
            docker-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-shard-plan-3.12
          path: pytest-shards
          run-id: 38842486211
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-evaluators
          path: rust/target/release
          run-id: 38842486211
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-projections
          path: .
          run-id: 38842486211
          github-token: ${{ github.token }}
      - name: Expose the exact-source native runtime
        shell: bash
        run: |
          chmod 0755 rust/target/release/guard-command-source rust/target/release/hol-guard-runtime
          echo "HOL_GUARD_NATIVE_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          echo "HOL_GUARD_BUILD_SOURCE_COMPILER=$GITHUB_WORKSPACE/rust/target/release/guard-command-source" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_BINARY=$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" >> "$GITHUB_ENV"
          echo "HOL_GUARD_NATIVE_REGRESSION=1" >> "$GITHUB_ENV"
      - name: Run the unchanged shard under coverage without retries
        env:
          GUARD_PYTEST_UNDER_COVERAGE: '1'
          PYTHONPATH: scripts/ci
        run: >-
          uv run --no-sync python scripts/ci/run_projection_shard.py pytest-shards/shard-054.txt --
          @pytest-shards/shard-054.txt --tb=short --durations=10
          -n 2 --dist loadfile --max-worker-restart 0 --reruns 0
          --cov --cov-branch --cov-report=
