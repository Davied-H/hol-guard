name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install exact stable compiler
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Check stable parallel frontend and backend options
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.99.0 rustc --version --verbose
          rustup run 1.99.0 rustc --help --verbose
          if rustup run 1.99.0 rustc --edition=2021 --jobs-frontend=2 --jobs-backend=2 .github/compiler-capability.rs -o "$RUNNER_TEMP/compiler-capability"; then
            "$RUNNER_TEMP/compiler-capability"
            echo 'STABLE_PARALLEL_OPTIONS=true'
          else
            echo 'STABLE_PARALLEL_OPTIONS=false'
          fi
