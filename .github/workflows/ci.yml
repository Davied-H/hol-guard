name: CI native optimization compile probe
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Stage unchanged native trust inputs
        run: python3 scripts/refresh_extension_artifacts.py --trust-only
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-opt-level-probe
          components: rustfmt
      - name: Prefetch the locked dependency sources
        run: cargo fetch --manifest-path rust/Cargo.toml --locked
      - name: Compare separate cold targets on the same runner
        run: python3 scripts/ci/probe_native_opt_level.py
