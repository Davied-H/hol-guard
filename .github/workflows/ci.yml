name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI_PYTHON_VERSION: '3.12.14'
jobs:
  audit-retained-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Verify the immutable execution run and successful native jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/hashgraph-online/hol-guard/actions/runs/38857470737 --jq .head_sha)" = e7773e50b8a6e1c29e6253ec35e597e5000bfdf4
          gh api 'repos/hashgraph-online/hol-guard/actions/runs/38857470737/jobs?per_page=100' --jq '.jobs | map(select(.name == "build" or .name == "consume (1)" or .name == "consume (2)")) | (length == 3 and all(.conclusion == "success"))' | grep -qx true
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12.14'
          cache-dependency-glob: uv.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 38857470737
          github-token: ${{ github.token }}
          path: qualification
      - name: Verify the original archive transfer digest
        working-directory: qualification/runtime-build
        run: sha256sum -c runtime-test-archive.sha256
      - name: Verify the full runnable partition union and negative controls
        run: .venv/bin/python .github/archive_qualification.py aggregate qualification/runtime-build/expected-tests.json qualification/selected-partition-1/partition-1.json qualification/selected-partition-2/partition-2.json
