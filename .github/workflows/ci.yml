name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI_PYTHON_VERSION: '3.12.14'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
      - run: python3 scripts/refresh_extension_artifacts.py --trust-only
      - run: bash scripts/ci/setup_sonar_rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust
          shared-key: sonar-${{ hashFiles('scripts/ci/sonar_rust_profile.sh', 'scripts/ci/rust_test_compiler.sh', 'rust/Cargo.toml') }}
          save-if: 'false'
      - name: Provision checked test linker
        run: |
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends lld
          fi
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Diagnose instrumented repository metadata verdicts
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: 'on'
          SCCACHE_GHA_VERSION: sonar-rust-checked-v1
          SCCACHE_GHA_RW_MODE: READ_ONLY
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        run: |
          set -euo pipefail
          repo_root="$GITHUB_WORKSPACE"
          source scripts/ci/sonar_rust_profile.sh
          toolchain="$(python -c 'import tomllib; print(tomllib.load(open("rust/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup component add --toolchain "$toolchain" llvm-tools-preview
          if [[ "$(cargo +"$toolchain" llvm-cov --version 2>/dev/null || true)" != 'cargo-llvm-cov 0.6.21' ]]; then
            cargo +"$toolchain" install cargo-llvm-cov --version '=0.6.21' --locked --force
          fi
          nextest_bin="$(python scripts/ci/install_nextest.py)"
          export PATH="$nextest_bin:$PATH"
          export LLVM_PROFILE_FILE_NAME='guard-%8m.profraw'
          cd rust
          cargo +"$toolchain" llvm-cov clean --workspace
          failed=0
          # Preserve every failure, including when later samples succeed.
          for sample in {1..12}; do
            echo "Metadata diagnostic sample $sample"
            if ! cargo +"$toolchain" llvm-cov nextest --locked --package guard-command --test integration \
              --profile ci --test-threads 4 --retries 0 --no-fail-fast --no-report \
              -E 'test(pretool_grep_repository_metadata::legacy_remote_definitions_are_screened)' \
              --failure-output immediate; then
              failed=1
            fi
          done
          exit "$failed"
