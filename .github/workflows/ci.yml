name: CI
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
env:
  CI_PYTHON_VERSION: '3.12.14'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  UV_HTTP_TIMEOUT: '300'
  CI_UV_CACHE_DEPENDENCY_GLOB: |
    pyproject.toml
    uv.lock
    requirements.txt
    docker-requirements.txt
jobs:
  native-command-evaluators:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-native-command-build
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.CI_PYTHON_VERSION }}
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
          save-cache: 'false'
      - name: Prepare the same public projections as ordinary CI
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
          uv run --no-sync python scripts/export_extension_directory.py --check
          uv run --no-sync python scripts/render_command_extension_directory.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytest-native-command-projections
          path: |
            contracts/extensions/
            docs/guard/extensions/
            src/codex_plugin_scanner/guard/contracts/data/extensions/
          if-no-files-found: error
          retention-days: 1
  macos-native-runtime:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-job-macos-native-runtime
  compare:
    name: Compare gate partition ${{ matrix.index }} (${{ matrix.order }})
    needs: [native-command-evaluators, macos-native-runtime]
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: 0, paired: 12, order: candidate-first}
          - {index: 1, paired: 13, order: control-first}
          - {index: 2, paired: 14, order: candidate-first}
          - {index: 3, paired: 15, order: control-first}
          - {index: 4, paired: 16, order: candidate-first}
          - {index: 5, paired: 17, order: control-first}
          - {index: 6, paired: 18, order: candidate-first}
          - {index: 7, paired: 19, order: control-first}
          - {index: 8, paired: 20, order: candidate-first}
          - {index: 9, paired: 21, order: control-first}
          - {index: 10, paired: 22, order: candidate-first}
          - {index: 11, paired: 23, order: control-first}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Record the exact source revision
        run: git rev-parse HEAD
      - name: Twelve-way candidate before controls
        if: matrix.order == 'candidate-first'
        timeout-minutes: 4
        uses: ./.github/actions/ci-job-macos-skill-identity
        with:
          python-version: '3.12'
          suite: gates
          shard-index: ${{ matrix.index }}
          shard-count: 12
      - name: Twenty-four-way control A
        timeout-minutes: 4
        uses: ./.github/actions/ci-job-macos-skill-identity
        with:
          python-version: '3.12'
          suite: gates
          shard-index: ${{ matrix.index }}
          shard-count: 24
      - name: Twenty-four-way control B
        timeout-minutes: 4
        uses: ./.github/actions/ci-job-macos-skill-identity
        with:
          python-version: '3.12'
          suite: gates
          shard-index: ${{ matrix.paired }}
          shard-count: 24
      - name: Twelve-way candidate after controls
        if: matrix.order == 'control-first'
        timeout-minutes: 4
        uses: ./.github/actions/ci-job-macos-skill-identity
        with:
          python-version: '3.12'
          suite: gates
          shard-index: ${{ matrix.index }}
          shard-count: 12
