name: CI checkout history comparison
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: c62bca1cdacc5ffc574fb8d48e31ac5483bb0b5e
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        order: [control-first, candidate-first]
    steps:
      - name: Load the pinned comparison driver
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: driver
          persist-credentials: false
      - name: Control checkout first
        if: matrix.order == 'control-first'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Candidate planner checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: planner
          fetch-depth: 2
          persist-credentials: false
      - name: Candidate analysis checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: analysis
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch complete analyzed history and main baseline
        working-directory: analysis
        run: |
          printf 'source_identity workflow=%s analyzed=%s checkout=%s\n' "$GITHUB_SHA" "$SOURCE_SHA" "$(git rev-parse HEAD)"
          GITHUB_SHA="$SOURCE_SHA" bash ../driver/scripts/ci/fetch_analysis_history.sh
      - name: Control checkout last
        if: matrix.order == 'candidate-first'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source, trusted plans, object closure and blame
        run: python driver/scripts/ci/verify_checkout_trial.py
