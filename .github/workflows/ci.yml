name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  approval-reuse-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 1942ca55ee80aff629e123c17da05f3d02e46737
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.14'
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12.14'
          cache-dependency-glob: uv.lock
      - name: Verify the artifact source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/hashgraph-online/hol-guard/actions/runs/38812881347 --jq .head_sha)" = 08aad3a1652133a85f9fd99a93ee04cf84d49032
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-evaluators
          path: rust/target/release
          run-id: 38812881347
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-native-command-projections
          path: .
          run-id: 38812881347
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytest-shard-plan-3.12
          path: pytest-shards
          run-id: 38812881347
          github-token: ${{ github.token }}
      - name: Reproduce approval reuse with full failure context
        env:
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_REGRESSION: '1'
        run: |
          chmod 0755 rust/target/release/hol-guard-runtime rust/target/release/guard-command-source
          uv run --no-sync python - <<'PY'
          import pathlib
          import subprocess
          import yaml
          workflow = yaml.safe_load(pathlib.Path('.github/workflows/ci.yml').read_text())
          step = next(s for s in workflow['jobs']['coverage']['steps'] if s.get('name', '').startswith('Run coverage shard'))
          script = step['run'].replace('${' + '{ matrix.shard-index }}', '35').replace('${' + '{ github.event_name }}', 'pull_request')
          script = script.replace('--tb=short', '--tb=long --showlocals')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script], check=True)
          PY
