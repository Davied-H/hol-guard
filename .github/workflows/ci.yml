name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI_PYTHON_VERSION: '3.12.14'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
jobs:
  instrumented-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact candidate source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e0ee5c4b26f35fc58e407502ecb07b15a7914d44
          git diff --exit-code HEAD^ HEAD -- rust scripts .github/actions
      - uses: ./.github/actions/prepare-rust-coverage
        with:
          partition: runtime-1
      - name: Run all direct-lane identity tests with instrumentation
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$GITHUB_WORKSPACE"
          source scripts/ci/sonar_rust_profile.sh
          nextest_bin="$(python scripts/ci/install_nextest.py)"
          export LLVM_PROFILE_FILE_NAME='guard-%8m.profraw'
          cd rust
          PATH="$nextest_bin:$PATH" cargo llvm-cov nextest --locked --package hol-guard-runtime --all-targets --profile ci --test-threads 4 --retries 0 --no-fail-fast --no-report -E 'test(direct_lane_identity_tests)'
