name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
jobs:
  windows-profile:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_VERBOSE: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: windows-shim-native-op
      - name: Fetch the common locked dependencies before either measurement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fetch --manifest-path rust/Cargo.toml --locked
          rustc --version --verbose
      - name: Control with full test debug information
        uses: ./.github/actions/ci-job-windows-shim-admin
        with:
          shim-gate: native-op
        env:
          CARGO_PROFILE_TEST_DEBUG: '2'
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-debug-control
      - name: Candidate with line-table test debug information
        uses: ./.github/actions/ci-job-windows-shim-admin
        with:
          shim-gate: native-op
        env:
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-debug-lines
      - name: Verify the vector family with the candidate profile too
        uses: ./.github/actions/ci-job-windows-shim-admin
        with:
          shim-gate: vectors
        env:
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-debug-lines
