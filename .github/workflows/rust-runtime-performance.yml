name: Rust runtime performance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  key-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set the first checkout timestamp without changing source bytes
        run: python3 -c 'import os; os.utime("scripts/ci/native_cache_environment.py", (1700000000, 1700000000))'
      - uses: ./.github/actions/restore-runtime-tests
        id: first
      - name: Change only the timestamp of the imported helper
        run: |
          python3 -c 'import os; os.utime("scripts/ci/native_cache_environment.py", (1730000000, 1730000000))'
          git diff --exit-code HEAD -- rust scripts contributions contracts spec tests/fixtures src/codex_plugin_scanner/guard/contracts .cargo .github/actions .github/workflows/ci.yml
      - uses: ./.github/actions/restore-runtime-tests
        id: second
      - name: Require identical keys for identical source and report real cache hits
        env:
          FIRST: ${{ steps.first.outputs.cache-primary-key }}
          SECOND: ${{ steps.second.outputs.cache-primary-key }}
          FIRST_HIT: ${{ steps.first.outputs.cache-hit }}
          SECOND_HIT: ${{ steps.second.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "first_cache_hit=$FIRST_HIT second_cache_hit=$SECOND_HIT"
          echo "first_source_hash=${FIRST##*-} second_source_hash=${SECOND##*-}"
          find scripts src/codex_plugin_scanner/guard/contracts -name '*.pyc' -print | wc -l
          test -n "$FIRST"
          test "$FIRST" = "$SECOND"
