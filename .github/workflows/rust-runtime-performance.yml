name: Rust runtime performance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  fresh-reader:
    name: Fresh exact-cache reader (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-runtime-tests
        id: runtime-archive
      - name: Require a real exact-input main cache hit
        env:
          CACHE_HIT: ${{ steps.runtime-archive.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.runtime-archive.outputs.cache-primary-key }}
        run: |
          test "$CACHE_HIT" = true
          test -s "$RUNNER_TEMP/runtime-test-archive.tar.zst"
          echo "exact_cache_key=$CACHE_KEY"
          git diff --exit-code 05038cc40c416e0c208f429a45e1bf31837a461a -- rust scripts contributions contracts spec tests/fixtures src/codex_plugin_scanner/guard/contracts .cargo .github/actions .github/workflows/ci.yml
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-workspace-test-runtime-${{ matrix.partition }}
          cache-fallback-key: ci-workspace-test
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Use the actual main wrapper and validation command bodies
        run: |
          python3 .github/runtime_cache_reader.py prepare
          bash -e -o pipefail "$RUNNER_TEMP/runtime-reader-wrapper.sh"
      - uses: ./.github/actions/setup-bubblewrap
      - name: Execute the full actual cache-hit test partition
        env:
          CARGO_CHECK: test-runtime-${{ matrix.partition }}
          RUNTIME_ARCHIVE_HIT: ${{ steps.runtime-archive.outputs.cache-hit }}
        run: bash -e -o pipefail "$RUNNER_TEMP/runtime-reader-validate.sh"
