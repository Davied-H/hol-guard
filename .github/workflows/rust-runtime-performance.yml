name: Rust runtime performance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_TEST_OPT_LEVEL: '1'
  CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  profile-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        order: ['1,0', '0,1']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-workspace-test-runtime-1
          cache-fallback-key: ci-workspace-test
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Use the unchanged checked compiler wrapper
        run: |
          wrapper_hash="$(sha256sum scripts/ci/rust_test_compiler.sh | cut -d ' ' -f 1)"
          wrapper="$RUNNER_TEMP/hol-guard-rust-test-$wrapper_hash"
          install -m 0755 scripts/ci/rust_test_compiler.sh "$wrapper"
          {
            echo "RUSTC_WORKSPACE_WRAPPER=$wrapper"
            echo "SCCACHE_GHA_ENABLED=on"
            echo "SCCACHE_GHA_VERSION=ci-workspace-test"
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-bubblewrap
      - name: Compare both profiles on identical source and execute every runtime test
        env:
          PROFILE_ORDER: ${{ matrix.order }}
        run: |
          nextest_bin="$(python3 scripts/ci/install_nextest.py)"
          PATH="$nextest_bin:$PATH" python3 .github/test_profile_probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-profile-comparison-${{ strategy.job-index }}
          path: test-profile-result.json
          if-no-files-found: error
