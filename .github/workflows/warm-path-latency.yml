name: Warm-path latency baseline

# Scratch profiling run: builds the candidate with symbols and samples the
# resident with perf while the warm MCP and hook phases run. Measurement only.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character candidate revision (empty means the dispatched ref)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  measure:
    name: Resident CPU profile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install static Linux linker and perf
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools linux-tools-common "linux-tools-$(uname -r)" || \
            sudo apt-get install --yes --no-install-recommends musl-tools linux-tools-common linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version
      - name: Build candidate with symbols
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/src-candidate" "$CANDIDATE_SHA"
          bash scripts/ci/build_installed_wheel_at_sha.sh "$RUNNER_TEMP/src-candidate" "$CANDIDATE_SHA"
          chmod go-w "$(readlink -f "$RUNNER_TEMP/src-candidate/.venv/bin/python")"
          file "$(find "$RUNNER_TEMP/src-candidate/.venv" -name hol-guard-runtime -type f | head -1)"
      - name: Profile resident during warm MCP calls
        run: |
          set -euo pipefail
          source scripts/ci/native-proof-environment.sh
          mkdir -p profile
          bash scripts/ci/profile_resident.sh profile/mcp 20 30 &
          profiler=$!
          python3 scripts/bench_warm_path_latency.py --target "candidate=$CANDIDATE_SHA=$RUNNER_TEMP/src-candidate/.venv/bin/python" \
            --rounds 1 --paths mcp --mcp-warmup 50 --mcp-samples 3000 --json profile/mcp-bench.json
          wait "$profiler" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: resident-profile-mcp
          path: profile/
          if-no-files-found: warn
      - name: Profile resident during warm hooks
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          source scripts/ci/native-proof-environment.sh
          bash scripts/ci/profile_resident.sh profile/hook 8 15 &
          profiler=$!
          python3 scripts/bench_warm_path_latency.py --target "candidate=$CANDIDATE_SHA=$RUNNER_TEMP/src-candidate/.venv/bin/python" \
            --rounds 1 --paths hook --hook-warmup 20 --hook-samples 3000 --json profile/hook-bench.json
          wait "$profiler" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: resident-profile-hook
          path: profile/hook*
          if-no-files-found: warn
