name: Pi-480 matched comparison
on:
  push:
    branches: [ci/pi480-matched-comparison]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  compare:
    name: Matched pi-480 (${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 30cff04d0b9857610e45dfc353167cc84b43efd2
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 1e960910e5bfd19d85cf810f39b11342dbf5d2bf
          path: pr4090
          persist-credentials: false
      - name: Record runner and revisions
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          git rev-parse HEAD
          git -C pr4090 rev-parse HEAD
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build each revision's native evaluators
        run: |
          set -euo pipefail
          for arm in main pr4090; do
            if [[ "$arm" == main ]]; then tree="$GITHUB_WORKSPACE"; else tree="$GITHUB_WORKSPACE/pr4090"; fi
            (
              cd "$tree"
              python3 scripts/refresh_extension_artifacts.py --trust-only
              CARGO_TARGET_DIR="$GITHUB_WORKSPACE/rust/target" cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
              mkdir -p "$RUNNER_TEMP/pi480-$arm"
              cp "$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime" "$GITHUB_WORKSPACE/rust/target/release/guard-command-source" "$RUNNER_TEMP/pi480-$arm/"
              python3 scripts/ci/verify_native_command_program.py --compiler "$RUNNER_TEMP/pi480-$arm/guard-command-source"
            )
          done
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare both locked Python environments
        run: |
          set -euo pipefail
          for tree in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/pr4090"; do
            (
              cd "$tree"
              uv sync --frozen --no-dev --group ci-test --python 3.12.14
              uv run --no-sync python scripts/export_extension_directory.py
              uv run --no-sync python scripts/render_command_extension_directory.py
            )
          done
      - name: Alternate three unchanged workload samples per revision
        env:
          HOL_GUARD_NATIVE_REGRESSION: "1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pi480-results"
          for round in 1 2 3; do
            if (( round % 2 )); then arms="main pr4090"; else arms="pr4090 main"; fi
            for arm in $arms; do
              if [[ "$arm" == main ]]; then tree="$GITHUB_WORKSPACE"; else tree="$GITHUB_WORKSPACE/pr4090"; fi
              set +e
              (
                cd "$tree"
                HOL_GUARD_NATIVE_BINARY="$RUNNER_TEMP/pi480-$arm/hol-guard-runtime" \
                  HOL_GUARD_NATIVE_SOURCE_COMPILER="$RUNNER_TEMP/pi480-$arm/guard-command-source" \
                  HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER="$RUNNER_TEMP/pi480-$arm/guard-command-source" \
                  HOL_GUARD_BUILD_SOURCE_COMPILER="$RUNNER_TEMP/pi480-$arm/guard-command-source" \
                  uv run --no-sync pytest 'tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]' -q --tb=short -p no:cacheprovider
              ) > "$RUNNER_TEMP/pi480-results/$arm-$round.log" 2>&1
              result=$?
              set -e
              echo "SAMPLE arm=$arm round=$round exit=$result"
              cat "$RUNNER_TEMP/pi480-results/$arm-$round.log"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pi480-matched-${{ matrix.replica }}
          path: ${{ runner.temp }}/pi480-results/*.log
