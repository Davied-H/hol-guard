name: Shipped runtime cache qualification

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [shipping-cache-hit, macos-cache-hit]
        default: shipping-cache-hit
        required: true
      source_ref:
        type: string
        default: main
        required: true

permissions:
  contents: read

jobs:
  shipping-cache-hit:
    if: inputs.suite == 'shipping-cache-hit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Stage shipped runtime trust bindings
        run: python3 scripts/refresh_extension_artifacts.py --trust-only
      - name: Identify the shipping build platform
        id: shipping-platform
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Restore the exact shipped runtime
        id: shipped-runtime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust/target/release/hol-guard-runtime
          key: shipped-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.shipping-platform.outputs.image }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', 'src/codex_plugin_scanner/guard/contracts/**', '.github/actions/setup-rust/action.yml', '.github/workflows/ci.yml') }}
      - name: Require a trusted cache hit
        env:
          CACHE_HIT: ${{ steps.shipped-runtime-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Measure the shipped fat-LTO runtime size
        run: python3 scripts/ci/check_wheel_size.py --native-dir rust/target/release --platform manylinux_2_17_x86_64
  macos-cache-hit:
    if: inputs.suite == 'macos-cache-hit'
    name: Qualify the exact macOS native runtime cache-hit path
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # A miss must fail, not disguise a fresh build as cache-hit evidence.
      RUSTC: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: ./.github/actions/ci-job-macos-native-runtime
