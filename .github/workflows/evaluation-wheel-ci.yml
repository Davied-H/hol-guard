name: Shipped runtime cache qualification

on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [shipping-cache-hit, windows-cold]
        default: shipping-cache-hit
        required: true

permissions:
  contents: read

jobs:
  shipping-cache-hit:
    if: inputs.suite == 'shipping-cache-hit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Stage shipped runtime trust bindings
        run: python3 scripts/refresh_extension_artifacts.py --trust-only
      - name: Identify the shipping build platform
        id: shipping-platform
        run: echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Restore the exact shipped runtime
        id: shipped-runtime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rust/target/release/hol-guard-runtime
          key: shipped-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.shipping-platform.outputs.image }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', 'src/codex_plugin_scanner/guard/contracts/**', '.github/actions/setup-rust/action.yml', '.github/workflows/ci.yml') }}
      - name: Require a trusted cache hit
        env:
          CACHE_HIT: ${{ steps.shipped-runtime-cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Measure the shipped fat-LTO runtime size
        run: python3 scripts/ci/check_wheel_size.py --native-dir rust/target/release --platform manylinux_2_17_x86_64
  windows-cold:
    if: inputs.suite == 'windows-cold'
    name: Measure a fully cold Windows functional build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 602ab7aa188a624c650ad81d2564cb3508f14005
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cold-qualification-${{ github.run_id }}
      - name: Build without binary or compiler caches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path rust/target/release/hol-guard-runtime.exe) { throw 'Unexpected prebuilt runtime' }
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime --config 'profile.release.package.hol-guard-runtime.opt-level=0' --config 'profile.release.package.guard-command.opt-level=0' --config 'profile.release.package.guard-command-build.opt-level=0'
          $timer.Stop()
          Write-Output "Cold compiler wall seconds: $($timer.Elapsed.TotalSeconds)"
