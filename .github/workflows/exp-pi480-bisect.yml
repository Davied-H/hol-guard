name: Experiment pi-480 latency bisect
# Measurement only; this branch is never merged.
on:
  push:
    branches: [exp/pi480-bisect]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  profile:
    name: profile ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    env:
      PI_NODE: tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 114272fdd53542ea2f73115775bb241fcaef48d5
          persist-credentials: false
      - name: Runner hardware
        run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build native evaluators
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          python3 scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare public directory
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
          uv pip install py-spy==0.4.1
      - name: Profile pi-480
        env:
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_REGRESSION: "1"
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
        run: |
          mkdir -p profiles
          for i in 1 2; do
            uv run --no-sync pytest "$PI_NODE" -q --tb=line -p no:cacheprovider 2>&1 | grep -E 'p95_ms|passed|failed' || true
          done
          before=$(ps -eo comm,cputimes | awk '$1 ~ /hol-guard-runt/ {s+=$2} END {print s+0}')
          /usr/bin/time -f 'PYTEST_CPU user=%U sys=%S wall=%e' .venv/bin/py-spy record --rate 250 --threads --format speedscope -o profiles/pi480.speedscope.json -- \
            .venv/bin/python -m pytest "$PI_NODE" -q --tb=line -p no:cacheprovider 2>&1 | grep -E 'p95_ms|passed|failed|PYTEST_CPU|py-spy' || true
          ps -eo pid,ppid,comm,cputimes,etimes | awk '$3 ~ /hol-guard-runt/' || true
          after=$(ps -eo comm,cputimes | awk '$1 ~ /hol-guard-runt/ {s+=$2} END {print s+0}')
          echo "RESIDENT_CPU_SECONDS_LIVE before=$before after=$after"
          /usr/bin/time -f 'PYTEST_CPU_NOPROFILE user=%U sys=%S wall=%e' .venv/bin/python -m pytest "$PI_NODE" -q --tb=line -p no:cacheprovider 2>&1 | grep -E 'p95_ms|PYTEST_CPU' || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pi480-profile-${{ matrix.n }}
          path: profiles/
          retention-days: 3
