name: Experiment pi-480 latency bisect
# Measurement only; this branch is never merged.
on:
  push:
    branches: [exp/pi480-bisect]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  ab:
    name: ab ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: fix-1, old: 0320660063205e4f9209187d0794c94be3d21a8c, new: ff68a0e8bd70d59d906fe875849b8dcf3a4478f9}
          - {label: fix-2, old: 0320660063205e4f9209187d0794c94be3d21a8c, new: ff68a0e8bd70d59d906fe875849b8dcf3a4478f9}
          - {label: fix-3, old: 0320660063205e4f9209187d0794c94be3d21a8c, new: ff68a0e8bd70d59d906fe875849b8dcf3a4478f9}
          - {label: fix-4, old: 0320660063205e4f9209187d0794c94be3d21a8c, new: ff68a0e8bd70d59d906fe875849b8dcf3a4478f9}
          - {label: fix-5, old: 0320660063205e4f9209187d0794c94be3d21a8c, new: ff68a0e8bd70d59d906fe875849b8dcf3a4478f9}
    env:
      PI_NODE: tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.new }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.old }}
          path: old
          persist-credentials: false
      - name: Runner hardware
        run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build native evaluators once (the change is Python-only)
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          python3 scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
          (cd old && python3 scripts/refresh_extension_artifacts.py --trust-only && python3 scripts/ci/verify_native_command_program.py --compiler "$GITHUB_WORKSPACE/rust/target/release/guard-command-source")
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare both trees
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
          cd old
          uv sync --frozen --no-dev --group ci-test --python 3.12.14
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
      - name: Alternate old and new pi-480 measurements
        env:
          HOL_GUARD_NATIVE_REGRESSION: "1"
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
        run: |
          measure() {
            (cd "$1" && uv run --no-sync pytest "$PI_NODE" -q --tb=line -p no:cacheprovider 2>&1 \
              | grep -oE 'p95_ms=[0-9.]+' | head -1 | sed "s/^/RESULT $2 /") || true
          }
          for i in 1 2 3 4 5 6; do
            measure old old
            measure . new
          done
