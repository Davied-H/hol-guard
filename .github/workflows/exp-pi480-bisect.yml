name: Experiment pi-480 latency bisect
# Measurement only; this branch is never merged.
on:
  push:
    branches: [exp/pi480-bisect]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  timeline:
    name: timeline ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    env:
      PI_NODE: tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ff68a0e8bd70d59d906fe875849b8dcf3a4478f9
          persist-credentials: false
      - name: Runner hardware
        run: lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build native evaluators
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          python3 scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare public directory and instrument the workload (experiment only)
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
          python3 - <<'INSTR'
          from pathlib import Path
          p = Path("tests/guard_daemon_acceptance_fixtures.py"); t = p.read_text()
          t = t.replace("    latencies_ms: list[float] = []\n", "    latencies_ms: list[float] = []\n    timeline: list[tuple[float, float]] = []\n    from codex_plugin_scanner.guard import native_resident_client as _nrc\n    _spawns = [0]\n    _orig_init = _nrc._PersistentNativeClient.__init__\n    def _counting_init(self, *a, **k):\n        _spawns[0] += 1\n        _orig_init(self, *a, **k)\n    _nrc._PersistentNativeClient.__init__ = _counting_init\n    _t0 = time.monotonic()\n", 1)
          t = t.replace("            latencies_ms.append(elapsed_ms)\n", "            latencies_ms.append(elapsed_ms)\n            timeline.append((started - _t0, elapsed_ms))\n", 1)
          t = t.replace("    ordered = sorted(latencies_ms)\n", "    _nrc._PersistentNativeClient.__init__ = _orig_init\n    timeline.sort()\n    def _pct(values, q):\n        values = sorted(values)\n        return values[min(len(values) - 1, int(q * len(values)))] if values else 0.0\n    first = [lat for _, lat in timeline[:48]]\n    rest = [lat for _, lat in timeline[48:]]\n    slow = sorted(timeline, key=lambda item: -item[1])[:24]\n    print(f\"TIMELINE spawns={_spawns[0]} first48_p50={_pct(first, 0.5):.0f} first48_max={max(first):.0f} rest_p95={_pct(rest, 0.95):.0f} rest_p50={_pct(rest, 0.5):.0f} slowest24_start_offsets={[round(s, 2) for s, _ in slow]}\", flush=True)\n    ordered = sorted(latencies_ms)\n", 1)
          assert t.count("TIMELINE") == 1 and t.count("timeline.append") == 1
          p.write_text(t)
          INSTR
      - name: Measure with timeline
        env:
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_REGRESSION: "1"
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
        run: |
          for i in 1 2 3 4; do
            uv run --no-sync pytest "$PI_NODE" -q -s --tb=line -p no:cacheprovider 2>&1 | grep -E 'TIMELINE|p95_ms' | head -2 || true
          done
