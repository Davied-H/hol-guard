name: Experiment pi-480 latency bisect
# Measurement only; this branch is never merged.
on:
  push:
    branches: [exp/pi480-bisect]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  ab:
    name: ab ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: green-vs-head-1, old: a3c6c11793f2be3e231882657e35d19489c8d9c7, new: 114272fdd53542ea2f73115775bb241fcaef48d5}
          - {label: green-vs-head-2, old: a3c6c11793f2be3e231882657e35d19489c8d9c7, new: 114272fdd53542ea2f73115775bb241fcaef48d5}
          - {label: green-vs-head-3, old: a3c6c11793f2be3e231882657e35d19489c8d9c7, new: 114272fdd53542ea2f73115775bb241fcaef48d5}
          - {label: pr4169-1, old: fa2b79b2deb8c1c5c17ae1fff1599c92d7ec7180, new: da723a48b221c135cbce3bade1bab3ddb4959044}
          - {label: pr4169-2, old: fa2b79b2deb8c1c5c17ae1fff1599c92d7ec7180, new: da723a48b221c135cbce3bade1bab3ddb4959044}
          - {label: pr4169-3, old: fa2b79b2deb8c1c5c17ae1fff1599c92d7ec7180, new: da723a48b221c135cbce3bade1bab3ddb4959044}
    env:
      PI_NODE: tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.new }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.old }}
          path: old
          persist-credentials: false
      - name: Runner hardware
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          nproc
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build new native evaluators
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          python3 scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
          mkdir -p "$RUNNER_TEMP/new-bin"
          cp rust/target/release/hol-guard-runtime rust/target/release/guard-command-source "$RUNNER_TEMP/new-bin/"
      - name: Build old native evaluators in the same target directory
        working-directory: old
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          mkdir -p "$RUNNER_TEMP/old-bin"
          cp "$CARGO_TARGET_DIR/release/hol-guard-runtime" "$CARGO_TARGET_DIR/release/guard-command-source" "$RUNNER_TEMP/old-bin/"
          python3 scripts/ci/verify_native_command_program.py --compiler "$RUNNER_TEMP/old-bin/guard-command-source"
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare both trees
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
          cd old
          uv sync --frozen --no-dev --group ci-test --python 3.12.14
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
      - name: Alternate old and new pi-480 measurements
        env:
          HOL_GUARD_NATIVE_REGRESSION: "1"
        run: |
          measure() {
            local dir=$1 bin=$2 label=$3
            (cd "$dir" && HOL_GUARD_NATIVE_BINARY="$bin/hol-guard-runtime" \
              HOL_GUARD_NATIVE_SOURCE_COMPILER="$bin/guard-command-source" \
              HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER="$bin/guard-command-source" \
              HOL_GUARD_BUILD_SOURCE_COMPILER="$bin/guard-command-source" \
              uv run --no-sync pytest "$PI_NODE" -q --tb=line -p no:cacheprovider 2>&1 \
              | grep -oE 'p95_ms=[0-9.]+' | sed "s/^/RESULT $label /") || true
          }
          for i in 1 2 3 4 5 6; do
            measure old "$RUNNER_TEMP/old-bin" old
            measure . "$RUNNER_TEMP/new-bin" new
          done
