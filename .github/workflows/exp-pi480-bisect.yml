name: Experiment pi-480 latency bisect
# Measurement only; this branch is never merged.
on:
  push:
    branches: [exp/pi480-bisect]
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  UV_HTTP_TIMEOUT: "300"
jobs:
  measure:
    name: measure ${{ matrix.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sha:
          - a3c6c11793f2be3e231882657e35d19489c8d9c7
          - da723a48b221c135cbce3bade1bab3ddb4959044
          - 114272fdd53542ea2f73115775bb241fcaef48d5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pytest-native-command
      - name: Build native evaluators exactly as CI does
        run: |
          python3 scripts/refresh_extension_artifacts.py --trust-only
          cargo build --manifest-path rust/Cargo.toml --locked --release -p guard-command -p hol-guard-runtime --bin guard-command-source --bin hol-guard-runtime
          python3 scripts/ci/verify_native_command_program.py --compiler rust/target/release/guard-command-source
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: "3.12.14"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Prepare public directory as CI does
        run: |
          uv run --no-sync python scripts/export_extension_directory.py
          uv run --no-sync python scripts/render_command_extension_directory.py
      - name: Measure pi-480 alone and after the shard-2 prefix
        env:
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          HOL_GUARD_NATIVE_REGRESSION: "1"
          HOL_GUARD_NATIVE_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_NATIVE_TEST_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
          HOL_GUARD_BUILD_SOURCE_COMPILER: ${{ github.workspace }}/rust/target/release/guard-command-source
        run: |
          pi='tests/test_guard_daemon_acceptance.py::test_packaged_correctness_workloads[pi-480-two-client-24]'
          for i in 1 2 3; do
            echo "### alone $i"
            uv run --no-sync pytest "$pi" -q --tb=line -p no:cacheprovider 2>&1 | grep -E 'workload pi-480|passed|failed' || true
          done
          for i in 1 2 3; do
            echo "### after prefix $i"
            uv run --no-sync pytest tests/test_guard_js_lockfile_resolution_phase11.py tests/test_guard_continuation_contract.py "$pi" -q --tb=line -p no:cacheprovider --durations=8 2>&1 | grep -E 'workload pi-480|passed|failed|s call|s setup|s teardown' || true
          done
          echo "### after lockfile only"
          uv run --no-sync pytest tests/test_guard_js_lockfile_resolution_phase11.py "$pi" -q --tb=line -p no:cacheprovider 2>&1 | grep -E 'workload pi-480|passed|failed' || true
          echo "### after continuation only"
          uv run --no-sync pytest tests/test_guard_continuation_contract.py "$pi" -q --tb=line -p no:cacheprovider 2>&1 | grep -E 'workload pi-480|passed|failed' || true
          echo "### leftover processes after the prefix"
          ps -eo pid,ppid,pcpu,etime,comm | grep -Ei 'guard|runtime|python' | grep -v grep || true
