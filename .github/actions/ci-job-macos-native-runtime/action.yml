name: CI macOS native runtime
description: Build and publish the macOS hol-guard-runtime for the skill-directory identity lane.
inputs:
  opt-level:
    description: Experiment-only workspace opt-level variant.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - name: Stage trust bindings the native build embeds
      shell: bash
      run: python scripts/refresh_extension_artifacts.py --trust-only
    - uses: ./.github/actions/setup-rust
    - name: Build the macOS native runtime
      shell: bash
      run: python scripts/ci/exp_opt_build.py ${{ inputs.opt-level }}
    - name: Upload the macOS native runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macos-native-runtime-${{ inputs.opt-level }}
        path: rust/target/release/hol-guard-runtime
        if-no-files-found: error
        retention-days: 1
        overwrite: true
    - name: Upload build timings
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: timings-macos-${{ inputs.opt-level }}
        path: rust/target/cargo-timings/cargo-timing.html
        if-no-files-found: error
        retention-days: 3
