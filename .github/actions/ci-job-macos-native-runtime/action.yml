name: CI macOS native runtime
description: Build and publish the macOS hol-guard-runtime for the skill-directory identity lane.
inputs:
  opt-level:
    description: Experiment-only release opt-level for the runtime build.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - name: Stage trust bindings the native build embeds
      shell: bash
      run: python scripts/refresh_extension_artifacts.py --trust-only
    - uses: ./.github/actions/setup-rust
    - name: Build the macOS native runtime
      shell: bash
      env:
        OPT: ${{ inputs.opt-level }}
      run: |
        extra=()
        if [[ "$OPT" == ws* ]]; then
          config="$RUNNER_TEMP/opt-level.toml"
          printf '[profile.release]\nopt-level = %s\n[profile.release.package."*"]\nopt-level = "s"\n' "${OPT#ws}" > "$config"
          cat "$config"
          extra=(--config "$config")
        fi
        cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime "${extra[@]}"
        python - <<'CLEAN'
        import json, subprocess
        m = json.loads(subprocess.check_output(["cargo", "metadata", "--manifest-path", "rust/Cargo.toml", "--no-deps", "--format-version", "1"]))
        args = ["cargo", "clean", "--manifest-path", "rust/Cargo.toml", "--release"]
        for p in m["packages"]:
            args += ["-p", p["name"]]
        print(" ".join(args)); subprocess.check_call(args)
        CLEAN
        cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime --timings "${extra[@]}"
    - name: Upload the macOS native runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macos-native-runtime-${{ inputs.opt-level }}
        path: rust/target/release/hol-guard-runtime
        if-no-files-found: error
        retention-days: 1
        overwrite: true
    - name: Upload build timings
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: timings-macos-opt-${{ inputs.opt-level }}
        path: rust/target/cargo-timings/cargo-timing.html
        if-no-files-found: error
        retention-days: 3
