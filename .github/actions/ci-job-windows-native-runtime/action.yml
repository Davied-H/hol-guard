name: CI Windows native runtime
description: Build and publish the Windows hol-guard-runtime for the packaged daemon gate.
inputs:
  opt-level:
    description: Experiment-only release opt-level for the runtime build.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"
    - name: Stage trust bindings the native build embeds
      shell: pwsh
      run: |
        python scripts/refresh_extension_artifacts.py --trust-only
        if ($LASTEXITCODE -ne 0) {
          throw "Staging Windows native trust bindings failed with exit code $LASTEXITCODE"
        }
    - name: Restore the cached Windows native runtime
      id: runtime-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime.exe
        # The hash must cover every build input outside rust/: guard-command's
        # build.rs reads contributions/ and contracts/extensions/trust, and
        # guard-policy-snapshot include_str!s spec/. A test asserts this key
        # stays complete.
        key: exp-opt-${{ inputs.opt-level }}-windows-hol-guard-runtime-v1-lto-${{ env.CARGO_PROFILE_RELEASE_LTO }}-cgu-${{ env.CARGO_PROFILE_RELEASE_CODEGEN_UNITS }}-${{ hashFiles('rust/**', 'contributions/**', 'contracts/**', 'spec/**', '.github/actions/setup-rust/action.yml', '.github/actions/ci-job-windows-native-runtime/action.yml') }}
    - uses: ./.github/actions/setup-rust
      if: steps.runtime-cache.outputs.cache-hit != 'true'
    - name: Build the Windows native runtime
      if: steps.runtime-cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        OPT: ${{ inputs.opt-level }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $extra = @()
        if ($env:OPT.StartsWith('ws')) {
          $config = Join-Path $env:RUNNER_TEMP "opt-level.toml"
          "[profile.release]`nopt-level = $($env:OPT.Substring(2))`n[profile.release.package.`"*`"]`nopt-level = `"s`"`n" | Set-Content -LiteralPath $config -Encoding utf8NoBOM
          Get-Content -LiteralPath $config
          $extra = @('--config', $config)
        }
        cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime @extra
        @'
        import json, subprocess
        m = json.loads(subprocess.check_output(["cargo", "metadata", "--manifest-path", "rust/Cargo.toml", "--no-deps", "--format-version", "1"]))
        args = ["cargo", "clean", "--manifest-path", "rust/Cargo.toml", "--release"]
        for p in m["packages"]:
            args += ["-p", p["name"]]
        print(" ".join(args)); subprocess.check_call(args)
        '@ | python -
        cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime --bin hol-guard-runtime --timings @extra
    - name: Save the Windows native runtime cache
      if: steps.runtime-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: rust/target/release/hol-guard-runtime.exe
        key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
    - name: Upload the Windows native runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-native-runtime-${{ inputs.opt-level }}
        path: rust/target/release/hol-guard-runtime.exe
        if-no-files-found: error
        retention-days: 1
        overwrite: true
    - name: Upload build timings
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: timings-windows-opt-${{ inputs.opt-level }}
        path: rust/target/cargo-timings/cargo-timing.html
        if-no-files-found: error
        retention-days: 3
